<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面歌词</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: transparent;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
            color: #fff;
            -webkit-text-stroke: 0;
            /* 卡拉OK 颜色变量 —— 已唱/未唱 文字色 + 描边色 独立配置 */
            --highlight-color: #ffffff;
            --highlight-stroke-color: #000000;
            --rest-color: rgba(180, 180, 180, 0.55);
            --rest-stroke-color: #000000;
            /* 非卡拉OK模式的默认描边（由 applySettingsWithoutFont 动态写入） */
            text-shadow:
                -1.5px -1.5px 0 #000,
                1.5px -1.5px 0 #000,
                -1.5px 1.5px 0 #000,
                1.5px 1.5px 0 #000,
                0 -1.5px 0 #000,
                0 1.5px 0 #000,
                -1.5px 0 0 #000,
                1.5px 0 0 #000;
        }
        
        .desktop-lyric-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: opacity 0.3s ease;
        }
        
        .desktop-lyric-container.interactive {
            background: rgba(0, 0, 0, 0.3);
        }
        
        .lyric-main {
            font-size: 28px;
            font-weight: 400;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 10px;
            opacity: 1;
            white-space: pre-wrap;
        }
        
        .lyric-main.empty {
            opacity: 0;
        }
        
        .lyric-main.karaoke-mode {
            display: inline-block;
            position: relative;
            line-height: 1.6;
        }

        /* ====== 卡拉OK：双层叠加方案 ======
           底层 .karaoke-rest  —— 未唱文字 + 未唱描边
           顶层 .karaoke-highlight —— 已唱文字 + 已唱描边，通过 .ks 逐字 clip-path 从左到右裁剪
           每层独立配置 fill + stroke 颜色，彻底避免 background-clip:text 的兼容问题

           【grid 重叠】两层放在同一 grid cell（grid-area: lyric），layout 完全同步。
           旧方案用 position:absolute + width:auto，但 absolute 元素用 shrink-to-fit 算法，
           加上 inline-block (.ks) 序列 + 零宽空格在 inline flow 中换行行为不可靠，
           导致 highlight 层的换行点与 rest 层不一致 → 位置错位。
           改用 grid 重叠后：cell 宽度由 rest 内容决定，highlight 强制 100% 宽度，
           两层在同一容器内 inline flow → 换行点 100% 一致。 */
        .lyric-main.karaoke-mode .lyric-karaoke-line {
            display: inline-grid;
            grid-template-areas: "lyric";
            /* 关闭 grid 间隙，避免影响 inline flow */
            grid-gap: 0;
        }
        /* grid item 居中对齐（行内基线） */
        .lyric-main.karaoke-mode .lyric-karaoke-line > * {
            grid-area: lyric;
            align-self: start;
            justify-self: stretch;
        }

        .lyric-main.karaoke-mode .karaoke-rest {
            color: var(--rest-color, rgba(180,180,180,0.55));
            /* 未唱描边 */
            text-shadow:
                -1.5px -1.5px 0 var(--rest-stroke-color, #000),
                1.5px -1.5px 0 var(--rest-stroke-color, #000),
                -1.5px 1.5px 0 var(--rest-stroke-color, #000),
                1.5px 1.5px 0 var(--rest-stroke-color, #000),
                0 -1.5px 0 var(--rest-stroke-color, #000),
                0 1.5px 0 var(--rest-stroke-color, #000),
                -1.5px 0 0 var(--rest-stroke-color, #000),
                1.5px 0 0 var(--rest-stroke-color, #000);
            z-index: 1;
            white-space: pre-wrap;
        }

        .lyric-main.karaoke-mode .karaoke-highlight {
            color: var(--highlight-color, #ffffff);
            /* 已唱描边 + 发光 */
            text-shadow:
                -1.5px -1.5px 0 var(--highlight-stroke-color, #000),
                1.5px -1.5px 0 var(--highlight-stroke-color, #000),
                -1.5px 1.5px 0 var(--highlight-stroke-color, #000),
                1.5px 1.5px 0 var(--highlight-stroke-color, #000),
                0 -1.5px 0 var(--highlight-stroke-color, #000),
                0 1.5px 0 var(--highlight-stroke-color, #000),
                -1.5px 0 0 var(--highlight-stroke-color, #000),
                1.5px 0 0 var(--highlight-stroke-color, #000),
                0 0 8px var(--highlight-color, #ffffff);
            /* 关键：width:100% 强制 highlight 宽度 = grid cell 宽度（=rest 宽度），
               不能再用 position:absolute + width:auto（shrink-to-fit 不可靠）。 */
            position: relative;  /* grid item 默认不是 positioning context，需显式设置让 z-index 生效 */
            width: 100%;
            z-index: 2;
            white-space: pre-wrap;
            pointer-events: none;
        }

        /* ====== 逐字（slot）clip-path ======
           旧方案在 .karaoke-highlight 整体上用单个 clip-path，文本换行后
           bounding box 包含多行，裁剪会同时作用于所有行 → 位置错误。
           新方案：highlight 层内每个字/词包一个 .ks span，每个 span 独立
           clip-path，天然适配多行换行。--p: 0~100% 控制单字可见区域。
           关键：
           1) .karaoke-highlight 用 grid 重叠 + width:100% 强制和 rest 同宽，
              inline flow 换行点与 rest 100% 一致。
           2) .ks 之间插入 <wbr>（HTML5 Word Break Opportunity 标签），
              避免 inline-block 序列被浏览器当作"原子词"整串换行。
           3) clip-path 用 padding+margin 技巧替代负 inset：
              旧公式 inset(-3px calc(100%-p-3px) -3px -3px) 在 p=0% 时
              仍残留 6px 可见条（left -3px + right 100%-3px → -3px~3px）。
              新方案：padding:0 3px 扩大 border-box 覆盖描边，margin:0 -3px
              补偿使字符间距不变，clip-path left:0 right:calc(100%-p)
              → p=0% 时 right=100% 完全不可见，p=100% 时 padding 覆盖描边。 */
        .lyric-main.karaoke-mode .karaoke-highlight .ks {
            display: inline-block;
            padding: 0 3px;
            margin: 0 -3px;
            clip-path: inset(-3px calc(100% - var(--p, 0%)) -3px 0);
        }
        
        .lyric-translation {
            font-size: 16px;
            text-align: center;
            line-height: 1.5;
            opacity: 1;
            text-shadow:
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000,
                0 -1px 0 #000,
                0 1px 0 #000,
                -1px 0 0 #000,
                1px 0 0 #000;
        }
        
        .lyric-translation.empty {
            opacity: 0;
        }

        /* ====== 译文卡拉OK：双层叠加方案（描边 1px，比主歌词更细） ======
           同样用 grid 重叠 + width:100% 解决换行错位。 */
        .lyric-translation.karaoke-mode {
            line-height: 1.5;
        }

        .lyric-translation.karaoke-mode .lyric-karaoke-line {
            display: inline-grid;
            grid-template-areas: "lyric";
            grid-gap: 0;
        }

        .lyric-translation.karaoke-mode .lyric-karaoke-line > * {
            grid-area: lyric;
            align-self: start;
            justify-self: stretch;
        }

        .lyric-translation.karaoke-mode .karaoke-rest {
            color: var(--rest-color, rgba(180,180,180,0.55));
            text-shadow:
                -1px -1px 0 var(--rest-stroke-color, #000),
                1px -1px 0 var(--rest-stroke-color, #000),
                -1px 1px 0 var(--rest-stroke-color, #000),
                1px 1px 0 var(--rest-stroke-color, #000),
                0 -1px 0 var(--rest-stroke-color, #000),
                0 1px 0 var(--rest-stroke-color, #000),
                -1px 0 0 var(--rest-stroke-color, #000),
                1px 0 0 var(--rest-stroke-color, #000);
            z-index: 1;
            white-space: pre-wrap;
        }

        .lyric-translation.karaoke-mode .karaoke-highlight {
            color: var(--highlight-color, #ffffff);
            text-shadow:
                -1px -1px 0 var(--highlight-stroke-color, #000),
                1px -1px 0 var(--highlight-stroke-color, #000),
                -1px 1px 0 var(--highlight-stroke-color, #000),
                1px 1px 0 var(--highlight-stroke-color, #000),
                0 -1px 0 var(--highlight-stroke-color, #000),
                0 1px 0 var(--highlight-stroke-color, #000),
                -1px 0 0 var(--highlight-stroke-color, #000),
                1px 0 0 var(--highlight-stroke-color, #000),
                0 0 6px var(--highlight-color, #ffffff);
            position: relative;  /* grid item 默认不是 positioning context */
            width: 100%;
            z-index: 2;
            white-space: pre-wrap;
            pointer-events: none;
        }

        /* 译文逐字 clip-path（同主歌词原理，padding+margin 覆盖描边） */
        .lyric-translation.karaoke-mode .karaoke-highlight .ks {
            display: inline-block;
            padding: 0 3px;
            margin: 0 -3px;
            clip-path: inset(-3px calc(100% - var(--p, 0%)) -3px 0);
        }
        
        .control-ui {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        .control-ui.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .control-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }
        
        .control-btn.close-btn {
            background: rgba(255, 100, 100, 0.6);
        }
        
        .control-btn.close-btn:hover {
            background: rgba(255, 60, 60, 0.8);
        }
        
        .control-btn.settings-btn {
            background: rgba(102, 204, 255, 0.6);
        }
        
        .control-btn.settings-btn:hover {
            background: rgba(102, 204, 255, 0.8);
        }
        
        .control-btn.karaoke-btn {
            background: rgba(255, 180, 100, 0.6);
        }
        
        .control-btn.karaoke-btn:hover,
        .control-btn.karaoke-btn.active {
            background: rgba(255, 180, 100, 0.9);
        }
        
        .hint-text {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: rgba(255, 255, 255, 0.8);
            -webkit-text-stroke: 0;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            font-weight: normal;
        }
        
        .hint-text.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="desktop-lyric-container" id="lyricContainer">
        <div class="lyric-main" id="lyricMain"></div>
        <div class="lyric-translation" id="lyricTranslation"></div>
        
        <div class="control-ui" id="controlUI">
            <button class="control-btn settings-btn" id="settingsBtn" title="设置">⚙</button>
            <button class="control-btn karaoke-btn" id="karaokeBtn" title="卡拉OK模式">🎤</button>
            <button class="control-btn" id="fontPlusBtn" title="增大字体">+</button>
            <button class="control-btn" id="fontMinusBtn" title="减小字体">−</button>
            <button class="control-btn close-btn" id="closeBtn" title="关闭">×</button>
        </div>
        
        <div class="hint-text" id="hintText">按 Ctrl+L 退出操作模式（全局生效）</div>
    </div>

    <script>
        const lyricMain = document.getElementById('lyricMain');
        const lyricTranslation = document.getElementById('lyricTranslation');
        const controlUI = document.getElementById('controlUI');
        const settingsBtn = document.getElementById('settingsBtn');
        const karaokeBtn = document.getElementById('karaokeBtn');
        const fontPlusBtn = document.getElementById('fontPlusBtn');
        const fontMinusBtn = document.getElementById('fontMinusBtn');
        const closeBtn = document.getElementById('closeBtn');
        const lyricContainer = document.getElementById('lyricContainer');
        const hintText = document.getElementById('hintText');
        
        let fontSize = 28;
        let isInteractive = false;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let winStartX = 0;
        let winStartY = 0;
        let isKaraokeMode = false;
        
        let lyricSettings = {
            textColor: '#ffffff',
            restColor: '#999999',
            highlightStrokeColor: '#000000',
            restStrokeColor: '#000000',
            fontSize: 28,
            fontFamily: 'Microsoft YaHei',
            fontFallback: 'Microsoft YaHei',
            karaokeMode: false
        };
        
        let currentKaraokeSlots = [];
        let currentTransKaraokeSlots = [];
        let currentKaraokePixelMap = null;   // { slotStarts, cacheKey } 主歌词像素缓存
        let currentTransKaraokePixelMap = null;
        let currentPlayTime = 0;
        let animationFrameId = null;
        let lastServerTime = 0;
        let lastServerTimestamp = 0;
        // 缓存最后一次歌词内容，卡拉OK模式切换时重新渲染结构，避免文字消失/描边色
        let lastLyricPayload = { text: '', translation: '', karaoke: [], translation_karaoke: [], lineEndTime: null };

        // ============ 像素级测量工具（解决字符宽度差异错位） ============
        const DL_TEXT_LAYOUT_PROPS = [
            'fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'fontVariant',
            'fontStretch', 'fontKerning', 'fontFeatureSettings', 'letterSpacing',
            'wordSpacing', 'lineHeight', 'textRendering', 'textTransform',
            'whiteSpace', 'overflowWrap', 'wordBreak'
        ];
        const dlMirrorEl = (() => {
            const el = document.createElement('span');
            el.style.cssText = 'position:fixed;top:-99999px;left:-99999px;opacity:0;pointer-events:none;' +
                'white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;' +
                'visibility:hidden;display:inline-block;max-width:none;';
            document.body.appendChild(el);
            return el;
        })();
        function _dlCopyTextStyles(dst, src) {
            const cs = window.getComputedStyle(src);
            for (const p of DL_TEXT_LAYOUT_PROPS) dst.style[p] = cs[p];
            // 关键修复：不继承源元素固定宽度，让 inline-block 收缩到内容宽度，
            // 测量纯 advance width；强制 pre 防止换行干扰。
            dst.style.width = 'auto';
            dst.style.maxWidth = 'none';
            dst.style.whiteSpace = 'pre';
        }
        function _dlHash(s) {
            let h = 0x811c9dc5;
            for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
            return h.toString(16);
        }
        /**
         * 测量某个 karaokeLine 元素 + slot 数组的像素边界百分比
         * @param {HTMLElement} karaokeLineEl .lyric-karaoke-line 元素（.karaoke-rest 也行，因为文本相同）
         * @param {Array} slots slot 数组
         */
        function _dlMeasurePixelMap(karaokeLineEl, slots) {
            if (!karaokeLineEl || !slots || slots.length === 0) return null;
            const mirror = dlMirrorEl;
            _dlCopyTextStyles(mirror, karaokeLineEl);
            const full = slots.map(s => s.text).join('');
            mirror.textContent = full;
            const totalW = mirror.getBoundingClientRect().width;
            if (totalW <= 0) return null;
            const slotStarts = new Array(slots.length + 1);
            slotStarts[0] = 0;
            let prefix = '';
            for (let i = 0; i < slots.length; i++) {
                prefix += slots[i].text;
                mirror.textContent = prefix;
                slotStarts[i + 1] = Math.min(100, (mirror.getBoundingClientRect().width / totalW) * 100);
            }
            slotStarts[slotStarts.length - 1] = 100;
            mirror.textContent = '';
            return slotStarts;
        }
        /** 用 slotStarts 数组计算 clip-path 百分比 */
        function _dlProgressFromPixelMap(slots, slotStarts, playTime) {
            let i = 0, done = 0;
            for (i = 0; i < slots.length; i++) {
                const slot = slots[i];
                if (playTime < slot.start - 1e-9) { done = slotStarts[i]; break; }
                if (playTime >= slot.end - 1e-9) continue;
                const dur = slot.end - slot.start;
                const partial = dur > 0 ? Math.min(1, Math.max(0, (playTime - slot.start) / dur)) : 0;
                done = slotStarts[i] + (slotStarts[i + 1] - slotStarts[i]) * partial;
                return Math.min(100, Math.max(0, done));
            }
            if (i >= slots.length) done = slotStarts[slots.length];
            return Math.min(100, Math.max(0, done));
        }
        /** 构建/获取主歌词或译文的缓存像素地图 */
        function _dlEnsurePixelMap(karaokeLineEl, slots, currentMapRef, fontSigSrc) {
            if (!slots.length || !karaokeLineEl) { currentMapRef.value = null; return; }
            const cs = window.getComputedStyle(fontSigSrc || karaokeLineEl);
            const fontSig = [cs.fontFamily, cs.fontSize, cs.fontWeight, cs.letterSpacing, cs.wordSpacing, cs.lineHeight].join('|');
            const text = slots.map(s => s.text).join('');
            const key = _dlHash(text) + '|' + _dlHash(fontSig);
            if (currentMapRef.value && currentMapRef.value.cacheKey === key) return;
            const slotStarts = _dlMeasurePixelMap(karaokeLineEl, slots);
            if (slotStarts) currentMapRef.value = { slotStarts, cacheKey: key };
        }
        
        function getLocalPlayTime() {
            if (lastServerTimestamp === 0) return currentPlayTime;
            const elapsed = (performance.now() - lastServerTimestamp) / 1000;
            return lastServerTime + elapsed;
        }
        
        function _isPureEnglishText(text) {
            if (!text) return true;
            return /^[A-Za-z0-9\s'\-,.?!:;()"]+$/.test(text);
        }
        
        function _buildFlattenCharSlots(karaoke, lineEndTime = null) {
            if (!Array.isArray(karaoke) || karaoke.length === 0) return [];
            const tokens = [];
            for (let i = 0; i < karaoke.length; i += 1) {
                const curr = karaoke[i];
                const currTime = curr.time_sec || 0;
                const currText = curr.text || '';
                if (!currText) {
                    if (tokens.length > 0) {
                        tokens[tokens.length - 1].end = currTime;
                    }
                    continue;
                }
                let nextTime = null;
                let j = i + 1;
                while (j < karaoke.length && Math.abs((karaoke[j].time_sec || 0) - currTime) < 1e-6) {
                    j += 1;
                }
                const hasSameTimeAfter = j > i + 1;
                let endTime = null;
                for (let k = j; k < karaoke.length; k += 1) {
                    const t = karaoke[k].time_sec || 0;
                    if (Math.abs(t - currTime) >= 1e-6) {
                        nextTime = t;
                        break;
                    }
                }
                if (hasSameTimeAfter) {
                    endTime = currTime;
                } else if (nextTime !== null) {
                    endTime = nextTime;
                }
                tokens.push({ start: currTime, end: endTime, text: currText });
            }
            if (tokens.length === 0) return [];
            const lastToken = tokens[tokens.length - 1];
            if (lastToken.end === null) {
                if (lineEndTime !== null && lineEndTime > lastToken.start) {
                    lastToken.end = lineEndTime;
                } else {
                    lastToken.end = lastToken.start + 0.6;
                }
            }
            const slots = [];
            for (let i = 0; i < tokens.length; i += 1) {
                const token = tokens[i];
                const duration = token.end - token.start;
                if (duration <= 0) {
                    const chars = Array.from(token.text);
                    for (let c = 0; c < chars.length; c += 1) {
                        slots.push({ start: token.start, end: token.start, text: chars[c] });
                    }
                    continue;
                }
                const chars = Array.from(token.text);
                const charCount = chars.length;
                if (charCount === 0) continue;
                if (_isPureEnglishText(token.text)) {
                    slots.push({ start: token.start, end: token.end, text: token.text });
                } else if (charCount === 1) {
                    slots.push({ start: token.start, end: token.end, text: chars[0] });
                } else {
                    const step = duration / charCount;
                    for (let c = 0; c < charCount; c += 1) {
                        const s = token.start + step * c;
                        const e = c === charCount - 1 ? token.end : token.start + step * (c + 1);
                        slots.push({ start: s, end: e, text: chars[c] });
                    }
                }
            }
            return slots;
        }
        
        function startKaraokeAnimation() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            function update() {
                if (isKaraokeMode && (currentKaraokeSlots.length > 0 || currentTransKaraokeSlots.length > 0)) {
                    updateKaraokeDisplay();
                }
                animationFrameId = requestAnimationFrame(update);
            }
            animationFrameId = requestAnimationFrame(update);
        }
        
        function stopKaraokeAnimation() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }
        
        function updateKaraokeDisplay() {
            const playTime = getLocalPlayTime();
            currentPlayTime = playTime;

            // 主歌词进度：逐字（slot）独立计算 clip-path 进度
            // 每个字/词有自己的 --p 变量（0~100%），天然适配多行换行
            const hlEl = lyricMain.querySelector('.karaoke-highlight');
            if (hlEl && currentKaraokeSlots.length > 0) {
                const ksEls = hlEl.querySelectorAll('.ks');
                for (let i = 0; i < currentKaraokeSlots.length && i < ksEls.length; i++) {
                    const slot = currentKaraokeSlots[i];
                    let p;
                    if (playTime >= slot.end - 1e-9) {
                        p = 100;
                    } else if (playTime < slot.start - 1e-9) {
                        p = 0;
                    } else {
                        const dur = slot.end - slot.start;
                        p = dur > 0 ? Math.min(100, Math.max(0, ((playTime - slot.start) / dur) * 100)) : 100;
                    }
                    ksEls[i].style.setProperty('--p', p.toFixed(2) + '%');
                }
            }

            // 译文字进度：同主歌词，逐字独立计算
            const transHlEl = lyricTranslation.querySelector('.karaoke-highlight');
            if (transHlEl && currentTransKaraokeSlots.length > 0) {
                const transKsEls = transHlEl.querySelectorAll('.ks');
                for (let i = 0; i < currentTransKaraokeSlots.length && i < transKsEls.length; i++) {
                    const slot = currentTransKaraokeSlots[i];
                    let p;
                    if (playTime >= slot.end - 1e-9) {
                        p = 100;
                    } else if (playTime < slot.start - 1e-9) {
                        p = 0;
                    } else {
                        const dur = slot.end - slot.start;
                        p = dur > 0 ? Math.min(100, Math.max(0, ((playTime - slot.start) / dur) * 100)) : 100;
                    }
                    transKsEls[i].style.setProperty('--p', p.toFixed(2) + '%');
                }
            }
        }
        
        if (window.electronAPI && window.electronAPI.onLyricUpdate) {
            window.electronAPI.onLyricUpdate((data) => {
                lastServerTime = data.currentTime || 0;
                lastServerTimestamp = performance.now();
                currentPlayTime = lastServerTime;
                // 缓存最后一次歌词内容（用于卡拉OK模式切换时重渲染）
                lastLyricPayload = {
                    text: data.text || '',
                    translation: data.translation || '',
                    karaoke: data.karaoke || [],
                    translation_karaoke: data.translation_karaoke || [],
                    lineEndTime: data.lineEndTime || null
                };
                updateLyric(lastLyricPayload.text, lastLyricPayload.translation, lastLyricPayload.karaoke, lastLyricPayload.translation_karaoke, lastLyricPayload.lineEndTime);
            });
        }
        
        if (window.electronAPI && window.electronAPI.onLyricInteractiveChange) {
            window.electronAPI.onLyricInteractiveChange((interactive) => {
                isInteractive = interactive;
                if (isInteractive) {
                    controlUI.classList.add('visible');
                    lyricContainer.classList.add('interactive');
                    hintText.classList.add('visible');
                    document.body.style.cursor = 'move';
                } else {
                    controlUI.classList.remove('visible');
                    lyricContainer.classList.remove('interactive');
                    hintText.classList.remove('visible');
                    document.body.style.cursor = 'default';
                }
            });
        }
        
        // ============ 字体系统 ============
        let customFontLoaded = false;
        let currentFontLoadToken = 0;
        let loadedFontFaces = [];
        let loadingFontKey = null;
        let loadingFontPromise = null;
        let currentFontWeight = '400';
        let lastFontFamilyStr = null;
        let fontsReady = false;
        let pendingLyricUpdate = null;
        let fontInstanceCounter = 0;
        let isInitializing = true;

        function clearLoadedFontFaces() {
            for (const ff of loadedFontFaces) {
                try { document.fonts.delete(ff.fontFace); } catch (_) {}
                if (ff.blobUrl) {
                    try { URL.revokeObjectURL(ff.blobUrl); } catch (_) {}
                }
            }
            loadedFontFaces = [];
        }

        function quoteFontFamily(name) {
            if (!name) return name;
            // Always quote: names with spaces, starting with digits, or containing special chars
            const needsQuoting = /^\d/.test(name) || /[^a-zA-Z0-9-]/.test(name) || name.includes(' ');
            if (needsQuoting) {
                return "'" + name + "'";
            }
            return name;
        }

        function inferFontWeight(fontName) {
            const lower = fontName.toLowerCase();
            if (lower.includes('thin')) return '100';
            if (lower.includes('extra light') || lower.includes('extralight')) return '200';
            if (lower.includes('light')) return '300';
            if (lower.includes('regular') || lower.includes('normal') || lower.includes('book')) return '400';
            if (lower.includes('medium')) return '500';
            if (lower.includes('semibold') || lower.includes('demibold')) return '600';
            if (lower.includes('bold')) return '700';
            if (lower.includes('extra bold') || lower.includes('extrabold')) return '800';
            if (lower.includes('black') || lower.includes('heavy')) return '900';
            return '400';
        }

        async function loadFontFaceFromUrl(fontName, url, fontWeight) {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Fetch failed: ' + response.status);
            const contentLength = response.headers.get('Content-Length');
            if (contentLength && parseInt(contentLength) === 0) {
                throw new Error('Font file is empty (0 bytes)');
            }
            const arrayBuffer = await response.arrayBuffer();
            if (arrayBuffer.byteLength === 0) {
                throw new Error('Font file data is empty');
            }
            
            console.log('[Font] Loading "' + fontName + '" from ' + arrayBuffer.byteLength + ' bytes with weight ' + fontWeight + '...');
            
            let fontFace;
            let usedBlobFallback = false;
            
            try {
                fontFace = new FontFace(fontName, arrayBuffer, { 
                    weight: fontWeight, 
                    style: 'normal' 
                });
                await fontFace.load();
            } catch (e) {
                console.warn('[Font] ArrayBuffer load failed for "' + fontName + '", falling back to Blob URL:', e.message);
                const blob = new Blob([arrayBuffer]);
                const blobUrl = URL.createObjectURL(blob);
                fontFace = new FontFace(fontName, 'url("' + blobUrl + '")', { 
                    weight: fontWeight, 
                    style: 'normal' 
                });
                await fontFace.load();
                usedBlobFallback = true;
                loadedFontFaces.push({ fontFace: fontFace, blobUrl: blobUrl });
            }
            
            if (!usedBlobFallback) {
                loadedFontFaces.push({ fontFace: fontFace, blobUrl: null });
            }
            
            document.fonts.add(fontFace);
            
            console.log('[Font] "' + fontName + '" loaded: weight=' + fontFace.weight + ' status=' + fontFace.status);
            
            return fontWeight;
        }

        async function loadFont(fontFamily, fontFallback) {
            if (!window.electronAPI) return null;

            console.log('[Font] loadFont called: primary="' + fontFamily + '", fallback="' + fontFallback + '"');
            clearLoadedFontFaces();

            fontInstanceCounter++;
            const customFontName = 'CustomLyricFont_' + fontInstanceCounter;
            const customFallbackName = 'CustomLyricFallbackFont_' + fontInstanceCounter;
            const fallbackFamily = fontFallback || fontFamily;

            const fontUrl = await window.electronAPI.getFontDataUrl(fontFamily);
            const fallbackUrl = fallbackFamily !== fontFamily
                ? await window.electronAPI.getFontDataUrl(fallbackFamily)
                : null;

            console.log('[Font] URLs: primary=' + fontUrl + ', fallback=' + fallbackUrl);

            if (!fontUrl && !fallbackUrl) {
                console.log('[Font] No URLs found, using system fonts only');
                const fontName = quoteFontFamily(fontFamily);
                const fallbackName = quoteFontFamily(fallbackFamily);
                return {
                    fontFamilyStr: fallbackFamily !== fontFamily
                        ? fontName + ', ' + fallbackName + ', sans-serif'
                        : fontName + ', sans-serif',
                    fontWeight: '400'
                };
            }

            let styleSheet = document.getElementById('custom-font-stylesheet');
            if (!styleSheet) {
                styleSheet = document.createElement('style');
                styleSheet.id = 'custom-font-stylesheet';
                document.head.appendChild(styleSheet);
            }

            const highlightStroke = lyricSettings.highlightStrokeColor || '#000000';
            const restStroke = lyricSettings.restStrokeColor || '#000000';
            const s = 1.5;
            const chain = [];
            let primaryWeight = inferFontWeight(fontFamily);
            let primaryLoaded = false;

            if (fontUrl) {
                try {
                    console.log('[Font] Loading primary font: ' + fontFamily + ' with weight ' + primaryWeight);
                    primaryWeight = await loadFontFaceFromUrl(customFontName, fontUrl, primaryWeight);
                    console.log('[Font] Primary font "' + fontFamily + '" loaded, weight=' + primaryWeight);
                    primaryLoaded = true;
                } catch (e) {
                    console.error('[Font] Primary font "' + fontFamily + '" failed:', e);
                }
                chain.push("'" + customFontName + "'");
                chain.push(quoteFontFamily(fontFamily));
            } else {
                console.log('[Font] Primary font "' + fontFamily + '" URL not found');
                chain.push(quoteFontFamily(fontFamily));
            }

            if (fallbackUrl && fallbackFamily !== fontFamily) {
                try {
                    // 回退字体与主字体使用相同字重注册，确保浏览器回退时
                    // 能精确匹配字重，不会合成加粗效果
                    const fallbackWeight = primaryLoaded ? primaryWeight : '400';
                    const actualFallbackWeight = await loadFontFaceFromUrl(customFallbackName, fallbackUrl, fallbackWeight);
                    console.log('[Font] Fallback font "' + fallbackFamily + '" loaded with weight ' + fallbackWeight);
                    if (!primaryLoaded) {
                        primaryWeight = '400';
                    }
                } catch (e) {
                    console.error('[Font] Fallback font "' + fallbackFamily + '" failed:', e);
                }
                chain.push("'" + customFallbackName + "'");
                chain.push(quoteFontFamily(fallbackFamily));
            } else if (fallbackFamily !== fontFamily) {
                console.log('[Font] Fallback font "' + fallbackFamily + '" URL not found');
                chain.push(quoteFontFamily(fallbackFamily));
            }

            chain.push('sans-serif');

            styleSheet.textContent =
                // 卡拉OK模式下，额外给 highlight 层加发光（描边已在静态 CSS 中定义，读 CSS 变量）
                // rest 层的描边也在静态 CSS 中定义
                '.lyric-main.karaoke-mode .karaoke-highlight {' +
                'text-shadow:' +
                '-' + s + 'px -' + s + 'px 0 var(--highlight-stroke-color, ' + highlightStroke + '), ' +
                s + 'px -' + s + 'px 0 var(--highlight-stroke-color, ' + highlightStroke + '), ' +
                '-' + s + 'px ' + s + 'px 0 var(--highlight-stroke-color, ' + highlightStroke + '), ' +
                s + 'px ' + s + 'px 0 var(--highlight-stroke-color, ' + highlightStroke + '), ' +
                '0 -' + s + 'px 0 var(--highlight-stroke-color, ' + highlightStroke + '), ' +
                '0 ' + s + 'px 0 var(--highlight-stroke-color, ' + highlightStroke + '), ' +
                '-' + s + 'px 0 0 var(--highlight-stroke-color, ' + highlightStroke + '), ' +
                s + 'px 0 0 var(--highlight-stroke-color, ' + highlightStroke + '), ' +
                '0 0 8px var(--highlight-color, ' + lyricSettings.textColor + ');' +
                '}' +
                '.lyric-main.karaoke-mode .karaoke-rest {' +
                'text-shadow:' +
                '-' + s + 'px -' + s + 'px 0 var(--rest-stroke-color, ' + restStroke + '), ' +
                s + 'px -' + s + 'px 0 var(--rest-stroke-color, ' + restStroke + '), ' +
                '-' + s + 'px ' + s + 'px 0 var(--rest-stroke-color, ' + restStroke + '), ' +
                s + 'px ' + s + 'px 0 var(--rest-stroke-color, ' + restStroke + '), ' +
                '0 -' + s + 'px 0 var(--rest-stroke-color, ' + restStroke + '), ' +
                '0 ' + s + 'px 0 var(--rest-stroke-color, ' + restStroke + '), ' +
                '-' + s + 'px 0 0 var(--rest-stroke-color, ' + restStroke + '), ' +
                s + 'px 0 0 var(--rest-stroke-color, ' + restStroke + ');' +
                '}';

            return { fontFamilyStr: chain.join(', '), fontWeight: primaryWeight };
        }

        function applyFontAndRefresh(fontFamilyStr, fontWeight) {
            console.log('[Font] applyFontAndRefresh: "' + fontFamilyStr + '", weight=' + fontWeight);
            console.log('[Font] Total fonts: ' + document.fonts.size);
            
            lastFontFamilyStr = fontFamilyStr;
            currentFontWeight = fontWeight;
            
            document.body.style.fontFamily = fontFamilyStr;
            lyricMain.style.fontFamily = fontFamilyStr;
            lyricTranslation.style.fontFamily = fontFamilyStr;
            
            document.body.style.fontWeight = fontWeight;
            lyricMain.style.fontWeight = fontWeight;
            lyricTranslation.style.fontWeight = fontWeight;
            
            // 验证字体是否可用
            const verifyFonts = async function() {
                try {
                    const fontNames = fontFamilyStr.split(',').map(function(s) { 
                        const trimmed = s.trim();
                        if (trimmed.startsWith("'") && trimmed.endsWith("'")) {
                            return trimmed.slice(1, -1);
                        }
                        return null;
                    }).filter(Boolean).filter(function(n) { return n.startsWith('CustomLyric'); });
                    
                    for (const name of fontNames) {
                        try {
                            const loaded = await document.fonts.load('16px ' + name);
                            console.log('[Font] Verified "' + name + '": loaded=' + loaded.length);
                        } catch (e) {
                            console.warn('[Font] Verification failed for "' + name + '":', e.message);
                        }
                    }
                    
                    const testEl = document.createElement('span');
                    testEl.textContent = '测试Testあアイウ';
                    testEl.style.fontFamily = fontFamilyStr;
                    testEl.style.fontWeight = fontWeight;
                    testEl.style.fontSize = '40px';
                    testEl.style.visibility = 'hidden';
                    document.body.appendChild(testEl);
                    requestAnimationFrame(function() {
                        const computedFont = window.getComputedStyle(testEl).fontFamily;
                        console.log('[Font] Computed fontFamily: ' + computedFont);
                        document.body.removeChild(testEl);
                    });
                } catch (e) {
                    console.warn('[Font] Font verification error:', e);
                }
            };
            verifyFonts();
            
            // 强制浏览器重新渲染
            void lyricMain.offsetHeight;
            void lyricTranslation.offsetHeight;
            
            // 对卡拉OK模式的两层都应用字体（主歌词 + 译文）
            const karaokeLine = lyricMain.querySelector('.lyric-karaoke-line');
            if (karaokeLine) {
                karaokeLine.style.fontFamily = fontFamilyStr;
                karaokeLine.style.fontWeight = fontWeight;
                const restEl = karaokeLine.querySelector('.karaoke-rest');
                const hlEl = karaokeLine.querySelector('.karaoke-highlight');
                if (restEl) { restEl.style.fontFamily = fontFamilyStr; restEl.style.fontWeight = fontWeight; }
                if (hlEl) { hlEl.style.fontFamily = fontFamilyStr; hlEl.style.fontWeight = fontWeight; }
            }
            const transKaraokeLine = lyricTranslation.querySelector('.lyric-karaoke-line');
            if (transKaraokeLine) {
                transKaraokeLine.style.fontFamily = fontFamilyStr;
                transKaraokeLine.style.fontWeight = fontWeight;
                const restEl = transKaraokeLine.querySelector('.karaoke-rest');
                const hlEl = transKaraokeLine.querySelector('.karaoke-highlight');
                if (restEl) { restEl.style.fontFamily = fontFamilyStr; restEl.style.fontWeight = fontWeight; }
                if (hlEl) { hlEl.style.fontFamily = fontFamilyStr; hlEl.style.fontWeight = fontWeight; }
            }

            console.log('[Font] Font applied: family="' + fontFamilyStr + '", weight=' + fontWeight + ', karaokeLine=' + (karaokeLine ? 'present' : 'none'));
            
            // 触发一次强制重绘：先清除再设置 font-family
            // 这是解决大字体首次加载不生效的关键步骤
            requestAnimationFrame(function() {
                document.body.style.fontFamily = fontFamilyStr;
                lyricMain.style.fontFamily = fontFamilyStr;
                lyricTranslation.style.fontFamily = fontFamilyStr;
                document.body.style.fontWeight = fontWeight;
                lyricMain.style.fontWeight = fontWeight;
                lyricTranslation.style.fontWeight = fontWeight;
            });
        }

        async function loadFontWithRetry(fontFamily, fontFallback, maxRetries) {
            maxRetries = maxRetries || 3;
            let lastError = null;
            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    const result = await loadFont(fontFamily, fontFallback);
                    if (result) return result;
                } catch (e) {
                    lastError = e;
                    console.warn('Font load attempt ' + (attempt + 1) + ' failed:', e);
                    if (attempt < maxRetries - 1) {
                        await new Promise(function(r) { setTimeout(r, 200 * (attempt + 1)); });
                    }
                }
            }
            throw lastError || new Error('Font load failed after retries');
        }

        async function applyFontSettings(fontFamily, fontFallback) {
            const fontKey = fontFamily + '|' + fontFallback;
            if (loadingFontKey === fontKey && loadingFontPromise) {
                return loadingFontPromise;
            }
            loadingFontKey = fontKey;
            loadingFontPromise = (async function() {
                const loadToken = ++currentFontLoadToken;
                try {
                    const result = await loadFontWithRetry(fontFamily, fontFallback, 3);
                    if (loadToken !== currentFontLoadToken) return;
                    applyFontAndRefresh(result.fontFamilyStr, result.fontWeight);
                    customFontLoaded = true;
                    fontsReady = true;
                    
                    // 应用待处理的歌词更新
                    if (pendingLyricUpdate) {
                        const update = pendingLyricUpdate;
                        pendingLyricUpdate = null;
                        updateLyric(update.text, update.translation, update.karaoke, update.translation_karaoke, update.lineEndTime);
                    }

                    // 延迟再应用一次，确保浏览器完全加载字体
                    setTimeout(function() {
                        if (loadToken !== currentFontLoadToken) return;
                        applyFontAndRefresh(result.fontFamilyStr, result.fontWeight);
                        // 再次应用待处理的歌词
                        if (pendingLyricUpdate) {
                            const update = pendingLyricUpdate;
                            pendingLyricUpdate = null;
                            updateLyric(update.text, update.translation, update.karaoke, update.translation_karaoke, update.lineEndTime);
                        }
                    }, 300);
                    
                    // 再延迟一次，覆盖所有可能的竞态条件
                    setTimeout(function() {
                        if (loadToken !== currentFontLoadToken) return;
                        applyFontAndRefresh(result.fontFamilyStr, result.fontWeight);
                    }, 1000);
                } catch (e) {
                    console.error('Font load failed after retries:', e);
                    // 字体加载失败时，仍然允许显示歌词（使用系统字体）
                    fontsReady = true;
                } finally {
                    if (loadingFontKey === fontKey) {
                        loadingFontKey = null;
                        loadingFontPromise = null;
                    }
                }
            })();
            return loadingFontPromise;
        }

        // 当字体设置变化时，重新加载字体
        if (window.electronAPI && window.electronAPI.onLyricSettingsChange) {
            window.electronAPI.onLyricSettingsChange(async function(settings) {
                if (!settings.fontFallback) settings.fontFallback = settings.fontFamily || 'Microsoft YaHei';
                const fontChanged = settings.fontFamily !== lyricSettings.fontFamily
                    || settings.fontFallback !== lyricSettings.fontFallback;
                lyricSettings = settings;
                isKaraokeMode = settings.karaokeMode || false;
                karaokeBtn.classList.toggle('active', isKaraokeMode);
                
                // 只应用非字体设置（颜色、大小等），不改变字重
                applySettingsWithoutFont();
                
                if (fontChanged || !customFontLoaded) {
                    // 字体变化时强制重新加载
                    fontsReady = false;
                    applyFontSettings(settings.fontFamily, settings.fontFallback);
                } else if (lastFontFamilyStr) {
                    // 字体没变化但已加载，重新应用字体确保不丢失
                    applyFontAndRefresh(lastFontFamilyStr, currentFontWeight);
                }
            });
        }
        
        // 初始化：先加载设置，再加载字体，最后显示歌词
        async function loadSettings() {
            if (window.electronAPI) {
                try {
                    // 第1步：获取设置
                    lyricSettings = await window.electronAPI.getLyricSettings();
                    if (!lyricSettings.fontFallback) lyricSettings.fontFallback = lyricSettings.fontFamily || 'Microsoft YaHei';
                    isKaraokeMode = lyricSettings.karaokeMode || false;
                    karaokeBtn.classList.toggle('active', isKaraokeMode);
                    
                    // 第2步：先应用基础设置（颜色、大小），但不改变字重
                    applySettingsWithoutFont();
                    
                    // 第3步：加载字体（异步）
                    applyFontSettings(lyricSettings.fontFamily, lyricSettings.fontFallback);
                } catch (e) {
                    console.error('Failed to load settings:', e);
                    applySettingsWithoutFont();
                    fontsReady = true;
                }
            }
        }
        
        function applySettingsWithoutFont() {
            document.body.style.color = lyricSettings.textColor;
            const highlightStroke = lyricSettings.highlightStrokeColor || '#000000';
            const restStroke = lyricSettings.restStrokeColor || '#000000';
            const restColor = lyricSettings.restColor || '#999999';
            // ⚠ 必须在 document.body 上设置内联变量，覆盖 body CSS 规则中的默认值
            // 若设在 documentElement(html) 上，body 自身的规则变量会遮蔽继承值
            document.body.style.setProperty('--highlight-color', lyricSettings.textColor);
            document.body.style.setProperty('--highlight-stroke-color', highlightStroke);
            document.body.style.setProperty('--rest-color', restColor);
            document.body.style.setProperty('--rest-stroke-color', restStroke);
            // 非卡拉OK模式的默认描边 = 已唱描边色
            const s = 1.5;
            const textShadow = 
                '-' + s + 'px -' + s + 'px 0 ' + highlightStroke + ', ' +
                s + 'px -' + s + 'px 0 ' + highlightStroke + ', ' +
                '-' + s + 'px ' + s + 'px 0 ' + highlightStroke + ', ' +
                s + 'px ' + s + 'px 0 ' + highlightStroke + ', ' +
                '0 -' + s + 'px 0 ' + highlightStroke + ', ' +
                '0 ' + s + 'px 0 ' + highlightStroke + ', ' +
                '-' + s + 'px 0 0 ' + highlightStroke + ', ' +
                s + 'px 0 0 ' + highlightStroke;
            document.body.style.textShadow = textShadow;
            lyricTranslation.style.textShadow = textShadow;
            
            document.body.style.fontWeight = currentFontWeight || '400';
            lyricMain.style.fontWeight = currentFontWeight || '400';
            lyricTranslation.style.fontWeight = currentFontWeight || '400';
            
            fontSize = lyricSettings.fontSize;
            lyricMain.style.fontSize = fontSize + 'px';
            lyricTranslation.style.fontSize = Math.floor(fontSize * 0.57) + 'px';

            // 修复：只在 karaoke-mode class 状态与预期不一致时才重渲染
            // 且必须有有效歌词内容，避免空行/设置变更导致文字消失
            const hasKaraokeClass = lyricMain.classList.contains('karaoke-mode');
            const hasKaraokePayload = lastLyricPayload && Array.isArray(lastLyricPayload.karaoke) && lastLyricPayload.karaoke.length > 0;
            const expectedKaraoke = isKaraokeMode && hasKaraokePayload;
            if (hasKaraokeClass !== expectedKaraoke && lastLyricPayload && lastLyricPayload.text
                && !lastLyricPayload.text.startsWith('(空行)')) {
                updateLyric(lastLyricPayload.text, lastLyricPayload.translation, lastLyricPayload.karaoke || [], lastLyricPayload.translation_karaoke || [], lastLyricPayload.lineEndTime);
            } else if (hasKaraokeClass && expectedKaraoke) {
                // 卡拉OK 模式未变，CSS 变量已自动生效（颜色/描边等）。
                // 逐字 clip-path 进度由 rAF 循环持续更新，无需手动触发重绘。
            }
        }
        
        // 兼容旧代码：applySettings 改为调用 applySettingsWithoutFont
        // 保留此函数名以避免其他地方的调用出错
        function applySettings(fontFamilyStr) {
            applySettingsWithoutFont();
            if (fontFamilyStr) {
                applyFontAndRefresh(fontFamilyStr, currentFontWeight || '400');
            }
        }
        
        loadSettings();
        
        // ============ 歌词更新 ============
        function updateLyric(text, translation, karaoke, translationKaraoke, lineEndTime) {
            karaoke = karaoke || [];
            translationKaraoke = translationKaraoke || [];
            // 行变更（DOM 重建）后清空像素缓存，确保重新测量真实宽度
            currentKaraokePixelMap = null;
            currentTransKaraokePixelMap = null;

            if (!fontsReady && !isInitializing) {
                pendingLyricUpdate = { text: text, translation: translation, karaoke: karaoke, translation_karaoke: translationKaraoke, lineEndTime: lineEndTime };
                return;
            }

            if (text && !text.startsWith('(空行)')) {
                if (isKaraokeMode && karaoke.length > 0) {
                    currentKaraokeSlots = _buildFlattenCharSlots(karaoke, lineEndTime);
                    if (currentKaraokeSlots.length > 0) {
                        const escapedText = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        // 双层叠加：底层 rest（整行文本） + 顶层 highlight（逐字 span，每个字独立 clip-path）
                        // 逐字方案：每个 .ks span 包裹一个字/词，--p 控制该字的可见百分比
                        // 天然适配多行换行：每个字独立裁剪，不受整体 bounding box 影响
                        // 关键：在 .ks 之间插入 <wbr>（HTML5 Word Break Opportunity 标签），
                        // 让 inline-block 序列获得可换行点。
                        // 否则连续的 inline-block 没有空白字符会构成不可分割的"词"，
                        // 容器放不下时整串换到下一行（与 rest 的 CJK 自由换行行为不一致）。
                        // <wbr> 零宽度、不影响视觉，比 \u200B 字符更可靠（元素级换行点）。
                        var highlightSlotsHtml = '';
                        for (var si = 0; si < currentKaraokeSlots.length; si++) {
                            var escSlot = String(currentKaraokeSlots[si].text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                            if (si > 0) highlightSlotsHtml += '<wbr>';
                            highlightSlotsHtml += '<span class="ks" style="--p:0%">' + escSlot + '</span>';
                        }
                        lyricMain.innerHTML =
                            '<span class="lyric-karaoke-line">' +
                                '<span class="karaoke-rest">' + escapedText + '</span>' +
                                '<span class="karaoke-highlight">' + highlightSlotsHtml + '</span>' +
                            '</span>';
                        lyricMain.classList.add('karaoke-mode');
                        startKaraokeAnimation();
                        updateKaraokeDisplay();
                        // 对卡拉OK两层都应用当前字体
                        if (lastFontFamilyStr) {
                            const restEl = lyricMain.querySelector('.karaoke-rest');
                            const hlEl = lyricMain.querySelector('.karaoke-highlight');
                            if (restEl) {
                                restEl.style.fontFamily = lastFontFamilyStr;
                                restEl.style.fontWeight = currentFontWeight || '400';
                            }
                            if (hlEl) {
                                hlEl.style.fontFamily = lastFontFamilyStr;
                                hlEl.style.fontWeight = currentFontWeight || '400';
                            }
                        }
                    } else {
                        lyricMain.textContent = text;
                        lyricMain.classList.remove('karaoke-mode');
                        stopKaraokeAnimation();
                    }
                } else {
                    lyricMain.textContent = text;
                    lyricMain.classList.remove('karaoke-mode');
                    stopKaraokeAnimation();
                }
                lyricMain.classList.remove('empty');
            } else {
                // 空行/空内容：保留现有文字（不清除），仅标记 empty 让其透明
                // 修复：设置变更时若当前行是空行，不应该把已经显示的文字清掉
                if (!lyricMain.classList.contains('karaoke-mode')) {
                    // 非卡拉OK模式：直接清空
                    lyricMain.textContent = '';
                }
                lyricMain.classList.add('empty');
                stopKaraokeAnimation();
            }

            // 译文渲染：卡拉OK模式下有 translation_karaoke 时使用双层叠加
            if (translation && translation.trim()) {
                if (isKaraokeMode && translationKaraoke.length > 0) {
                    currentTransKaraokeSlots = _buildFlattenCharSlots(translationKaraoke, lineEndTime);
                    if (currentTransKaraokeSlots.length > 0) {
                        const escapedTrans = String(translation).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        // 译文逐字 span（同主歌词原理，<wbr> 提供换行点）
                        var transHighlightSlotsHtml = '';
                        for (var ti = 0; ti < currentTransKaraokeSlots.length; ti++) {
                            var escTransSlot = String(currentTransKaraokeSlots[ti].text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                            if (ti > 0) transHighlightSlotsHtml += '<wbr>';
                            transHighlightSlotsHtml += '<span class="ks" style="--p:0%">' + escTransSlot + '</span>';
                        }
                        lyricTranslation.innerHTML =
                            '<span class="lyric-karaoke-line">' +
                                '<span class="karaoke-rest">' + escapedTrans + '</span>' +
                                '<span class="karaoke-highlight">' + transHighlightSlotsHtml + '</span>' +
                            '</span>';
                        lyricTranslation.classList.add('karaoke-mode');
                        updateKaraokeDisplay();
                        if (lastFontFamilyStr) {
                            const restEl = lyricTranslation.querySelector('.karaoke-rest');
                            const hlEl = lyricTranslation.querySelector('.karaoke-highlight');
                            if (restEl) {
                                restEl.style.fontFamily = lastFontFamilyStr;
                                restEl.style.fontWeight = currentFontWeight || '400';
                            }
                            if (hlEl) {
                                hlEl.style.fontFamily = lastFontFamilyStr;
                                hlEl.style.fontWeight = currentFontWeight || '400';
                            }
                        }
                    } else {
                        lyricTranslation.textContent = translation;
                        lyricTranslation.classList.remove('karaoke-mode');
                        currentTransKaraokeSlots = [];
                    }
                } else {
                    lyricTranslation.textContent = translation;
                    lyricTranslation.classList.remove('karaoke-mode');
                    currentTransKaraokeSlots = [];
                }
                lyricTranslation.classList.remove('empty');
            } else {
                lyricTranslation.textContent = '';
                lyricTranslation.classList.add('empty');
                lyricTranslation.classList.remove('karaoke-mode');
                currentTransKaraokeSlots = [];
            }
        }
        
        // 初始化完成后解除 isInitializing 标志
        // 如果字体仍未就绪（不应发生），强制解锁歌词显示
        setTimeout(function() {
            isInitializing = false;
            if (!fontsReady) {
                fontsReady = true;
                console.log('[Font] Init timeout, forcing fontsReady=true');
                if (pendingLyricUpdate) {
                    const update = pendingLyricUpdate;
                    pendingLyricUpdate = null;
                    updateLyric(update.text, update.translation, update.karaoke, update.translation_karaoke, update.lineEndTime);
                }
            }
        }, 2000);
        
        // ============ 拖拽交互 ============
        lyricContainer.addEventListener('mousedown', async function(e) {
            if (!isInteractive || e.target.classList.contains('control-btn')) return;
            
            isDragging = true;
            dragStartX = e.screenX;
            dragStartY = e.screenY;
            
            if (window.electronAPI) {
                const pos = await window.electronAPI.getLyricWindowPosition();
                winStartX = pos[0];
                winStartY = pos[1];
            }
            
            document.body.style.cursor = 'grabbing';
        });
        
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            const dx = e.screenX - dragStartX;
            const dy = e.screenY - dragStartY;
            const newX = winStartX + dx;
            const newY = winStartY + dy;
            if (window.electronAPI) {
                window.electronAPI.moveLyricWindow(newX, newY);
            }
        });
        
        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                document.body.style.cursor = isInteractive ? 'move' : 'default';
            }
        });
        
        // ============ 按钮事件 ============
        settingsBtn.addEventListener('click', function() {
            if (window.electronAPI) {
                window.electronAPI.openLyricSettings();
            }
        });
        
        karaokeBtn.addEventListener('click', function() {
            isKaraokeMode = !isKaraokeMode;
            karaokeBtn.classList.toggle('active', isKaraokeMode);
            if (window.electronAPI) {
                window.electronAPI.saveLyricSettings({ karaokeMode: isKaraokeMode });
            }
            // 立即重渲染当前歌词 → 切换卡拉OK结构/普通结构，避免文字消失/描边色
            lyricSettings.karaokeMode = isKaraokeMode;
            updateLyric(lastLyricPayload.text, lastLyricPayload.translation, lastLyricPayload.karaoke || [], lastLyricPayload.translation_karaoke || [], lastLyricPayload.lineEndTime);
        });
        
        fontPlusBtn.addEventListener('click', function() {
            fontSize = Math.min(fontSize + 4, 60);
            lyricMain.style.fontSize = fontSize + 'px';
            if (window.electronAPI) {
                window.electronAPI.saveLyricSettings({ fontSize: fontSize });
            }
        });
        
        fontMinusBtn.addEventListener('click', function() {
            fontSize = Math.max(fontSize - 4, 16);
            lyricMain.style.fontSize = fontSize + 'px';
            if (window.electronAPI) {
                window.electronAPI.saveLyricSettings({ fontSize: fontSize });
            }
        });
        
        closeBtn.addEventListener('click', function() {
            if (window.electronAPI) {
                window.electronAPI.closeDesktopLyric();
            }
        });
        
        document.body.addEventListener('mouseleave', function() {
            if (isInteractive) {
                if (window.electronAPI) {
                    window.electronAPI.toggleLyricInteractive(false);
                }
            }
        });
    </script>
</body>
</html>
