<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面歌词设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #2d2d2d;
            color: #fff;
            padding: 20px;
        }
        
        .settings-container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .setting-item {
            margin-bottom: 20px;
        }
        
        .setting-label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #ccc;
        }
        
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .color-input {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }
        
        .color-preview {
            flex: 1;
            height: 40px;
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .text-input, .number-input, .select-input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .text-input:focus, .number-input:focus, .select-input:focus {
            border-color: #66CCFF;
        }
        
        .number-input {
            width: 120px;
        }
        
        .font-family-options {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .font-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            min-height: 38px;
        }
        
        .font-option:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .font-option.selected {
            border-color: #66CCFF;
            background: rgba(102, 204, 255, 0.25);
            color: #66CCFF;
            font-weight: 600;
            box-shadow: 0 0 8px rgba(102, 204, 255, 0.4);
        }

        .font-option-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left;
            margin-right: 12px;
            line-height: 1.3;
        }

        .font-option-preview {
            flex-shrink: 0;
            font-size: 16px;
            opacity: 0.7;
            white-space: nowrap;
        }

        .font-option-tag {
            flex-shrink: 0;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            margin-left: 8px;
        }

        .font-option.selected .font-option-tag {
            background: rgba(102, 204, 255, 0.3);
            color: #66CCFF;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #66CCFF;
            color: #000;
        }
        
        .btn-primary:hover {
            background: #80d4ff;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <h2 style="text-align: center; margin-bottom: 20px; color: #66CCFF;">桌面歌词设置</h2>
        
        <div class="setting-item">
            <label class="setting-label">已唱文字颜色（高亮色）</label>
            <div class="color-picker-wrapper">
                <input type="color" id="textColorPicker" class="color-input">
                <div class="color-preview" id="textColorPreview">预览</div>
            </div>
        </div>
        
        <div class="setting-item">
            <label class="setting-label">已唱描边颜色</label>
            <div class="color-picker-wrapper">
                <input type="color" id="highlightStrokeColorPicker" class="color-input">
                <div class="color-preview" id="highlightStrokeColorPreview">预览</div>
            </div>
        </div>
        
        <div class="setting-item">
            <label class="setting-label">未唱文字颜色</label>
            <div class="color-picker-wrapper">
                <input type="color" id="restColorPicker" class="color-input">
                <div class="color-preview" id="restColorPreview">预览</div>
            </div>
        </div>
        
        <div class="setting-item">
            <label class="setting-label">未唱描边颜色</label>
            <div class="color-picker-wrapper">
                <input type="color" id="restStrokeColorPicker" class="color-input">
                <div class="color-preview" id="restStrokeColorPreview">预览</div>
            </div>
        </div>
        
        <div class="divider"></div>
        
        <div class="setting-item">
            <label class="setting-label">字体大小</label>
            <input type="number" id="fontSizeInput" class="number-input" min="12" max="72" value="28">
        </div>
        
        <div class="divider"></div>
        
        <div class="setting-item">
            <label class="setting-label">主字体</label>
            <input type="text" id="fontSearchInput" class="text-input" placeholder="搜索字体..." style="margin-bottom: 8px;">
            <div class="font-family-options" id="fontFamilyOptions" style="max-height: 240px; overflow-y: auto;">
            </div>
        </div>

        <div class="divider"></div>

        <div class="setting-item">
            <label class="setting-label">回退字体</label>
            <input type="text" id="fontFallbackSearchInput" class="text-input" placeholder="搜索字体..." style="margin-bottom: 8px;">
            <div class="font-family-options" id="fontFallbackOptions" style="max-height: 240px; overflow-y: auto;">
            </div>
        </div>
        
        <div class="divider"></div>
        
        <div class="setting-item">
            <label class="setting-label">卡拉OK模式</label>
            <div style="display: flex; align-items: center; gap: 12px;">
                <input type="checkbox" id="karaokeModeInput" style="width: 20px; height: 20px; cursor: pointer;">
                <span style="color: #ccc;">启用逐字高亮效果</span>
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn btn-secondary" id="resetBtn">重置</button>
            <button class="btn btn-primary" id="saveBtn">保存</button>
        </div>
    </div>

    <script>
        const textColorPicker = document.getElementById('textColorPicker');
        const textColorPreview = document.getElementById('textColorPreview');
        const highlightStrokeColorPicker = document.getElementById('highlightStrokeColorPicker');
        const highlightStrokeColorPreview = document.getElementById('highlightStrokeColorPreview');
        const restColorPicker = document.getElementById('restColorPicker');
        const restColorPreview = document.getElementById('restColorPreview');
        const restStrokeColorPicker = document.getElementById('restStrokeColorPicker');
        const restStrokeColorPreview = document.getElementById('restStrokeColorPreview');
        const fontSizeInput = document.getElementById('fontSizeInput');
        const fontFamilyOptions = document.getElementById('fontFamilyOptions');
        const fontSearchInput = document.getElementById('fontSearchInput');
        const fontFallbackOptions = document.getElementById('fontFallbackOptions');
        const fontFallbackSearchInput = document.getElementById('fontFallbackSearchInput');
        const karaokeModeInput = document.getElementById('karaokeModeInput');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');

        let currentSettings = {
            textColor: '#ffffff',
            highlightStrokeColor: '#000000',
            restColor: '#999999',
            restStrokeColor: '#000000',
            fontSize: 28,
            fontFamily: 'Microsoft YaHei',
            fontFallback: 'Microsoft YaHei',
            karaokeMode: false
        };
        
        let allFonts = [];
        
        async function loadSettings() {
            if (window.electronAPI) {
                currentSettings = await window.electronAPI.getLyricSettings();
                await loadSystemFonts();
                updateUI();
            }
        }
        
        async function loadSystemFonts() {
            if (window.electronAPI) {
                try {
                    allFonts = await window.electronAPI.getSystemFonts();
                } catch (e) {
                    console.error('Failed to load system fonts:', e);
                }
            }
            if (allFonts.length === 0) {
                allFonts = ['Microsoft YaHei', 'SimSun', 'SimHei', 'KaiTi', 'Arial', 'Times New Roman'];
            }
            renderFontOptions(allFonts, fontFamilyOptions);
            renderFontOptions(allFonts, fontFallbackOptions);
        }

        function simplifyFontName(name) {
            if (!name) return name;
            // 去除后缀：Regular, Bold, Light, 等字重标识
            let simplified = name
                .replace(/\s*(Regular|Bold|Light|Medium|Black|Thin|ExtraLight|SemiBold|Heavy|Italic|Oblique)\s*$/i, '')
                .replace(/\s*&.*$/, '')  // 去除 "& ..." 后缀（如 Noto Sans CJK KR Regular & ...）
                .replace(/\s{2,}/g, ' ')
                .trim();
            // 尝试提取基础家族名
            const familyMatch = simplified.match(/^(.+?)\s+(CJK|Mono|Sans|Serif|Display|Handwriting|Monospace)\b/i);
            if (familyMatch) {
                const base = simplified.split(/\s+(CJK|Mono)\s+/i)[0];
                const suffix = simplified.match(/(CJK|Mono)\s+(KR|SC|TC|JP)\b/i);
                if (suffix) {
                    return simplified.replace(/\s+(KR|SC|TC|JP)\s+(Regular|Bold|Light|Medium|Black|Thin).*$/i, '');
                }
            }
            return simplified || name;
        }

        function getFontTag(displayName, familyName) {
            if (displayName === familyName) return '';
            // 提取语种标签
            const langMatch = displayName.match(/\b(KR|SC|TC|JP|HK)\b/);
            if (langMatch) return langMatch[1];
            return '';
        }

        function renderFontOptions(fonts, container) {
            container.innerHTML = '';

            fonts.forEach(font => {
                const familyName = font.familyName || font;
                const displayName = font.displayName || familyName;
                const shortName = simplifyFontName(displayName);
                const tag = getFontTag(displayName, familyName);

                const fontOption = document.createElement('div');
                fontOption.className = 'font-option';
                fontOption.dataset.font = familyName;
                fontOption.title = displayName; // 悬停显示完整名

                const nameSpan = document.createElement('span');
                nameSpan.className = 'font-option-name';
                nameSpan.textContent = shortName;
                nameSpan.title = displayName;

                // 尝试用该字体渲染预览（对系统字体有效）
                const previewSpan = document.createElement('span');
                previewSpan.className = 'font-option-preview';
                previewSpan.textContent = 'Aa 字';
                previewSpan.style.fontFamily = familyName.replace(/['"]/g, '');
                previewSpan.title = displayName;

                fontOption.appendChild(nameSpan);
                if (tag) {
                    const tagSpan = document.createElement('span');
                    tagSpan.className = 'font-option-tag';
                    tagSpan.textContent = tag;
                    fontOption.appendChild(tagSpan);
                }
                fontOption.appendChild(previewSpan);

                container.appendChild(fontOption);
            });

            updateUI();
        }

        function filterFonts(query, container) {
            const q = query.toLowerCase().trim();
            if (!q) {
                renderFontOptions(allFonts, container);
                return;
            }
            const filtered = allFonts.filter(f => {
                const familyName = f.familyName || f;
                const displayName = f.displayName || familyName;
                const shortName = simplifyFontName(displayName);
                return familyName.toLowerCase().includes(q) 
                    || displayName.toLowerCase().includes(q)
                    || shortName.toLowerCase().includes(q);
            });
            renderFontOptions(filtered, container);
        }
        
        function updateUI() {
            const hlStroke = currentSettings.highlightStrokeColor || '#000000';
            const restStroke = currentSettings.restStrokeColor || '#000000';
            const s = 1.5;
            const makeShadow = (c) => `
                -${s}px -${s}px 0 ${c},
                ${s}px -${s}px 0 ${c},
                -${s}px ${s}px 0 ${c},
                ${s}px ${s}px 0 ${c},
                0 -${s}px 0 ${c},
                0 ${s}px 0 ${c},
                -${s}px 0 0 ${c},
                ${s}px 0 0 ${c}
            `;

            // 已唱文字颜色
            textColorPicker.value = currentSettings.textColor;
            textColorPreview.style.color = currentSettings.textColor;
            textColorPreview.style.textShadow = makeShadow(hlStroke);
            textColorPreview.style.webkitTextStroke = '0';
            textColorPreview.textContent = currentSettings.textColor + '（已唱填充）';

            // 已唱描边颜色
            highlightStrokeColorPicker.value = hlStroke;
            highlightStrokeColorPreview.style.color = hlStroke;
            highlightStrokeColorPreview.style.textShadow = makeShadow(hlStroke);
            highlightStrokeColorPreview.style.webkitTextStroke = '0';
            highlightStrokeColorPreview.textContent = hlStroke + '（已唱描边）';

            // 未唱文字颜色
            const restColor = currentSettings.restColor || '#999999';
            restColorPicker.value = restColor;
            restColorPreview.style.color = restColor;
            restColorPreview.style.textShadow = makeShadow(restStroke);
            restColorPreview.style.webkitTextStroke = '0';
            restColorPreview.textContent = restColor + '（未唱填充）';

            // 未唱描边颜色
            restStrokeColorPicker.value = restStroke;
            restStrokeColorPreview.style.color = restStroke;
            restStrokeColorPreview.style.textShadow = makeShadow(restStroke);
            restStrokeColorPreview.style.webkitTextStroke = '0';
            restStrokeColorPreview.textContent = restStroke + '（未唱描边）';
            
            fontSizeInput.value = currentSettings.fontSize;
            
            fontFamilyOptions.querySelectorAll('.font-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.font === currentSettings.fontFamily);
            });
            fontFallbackOptions.querySelectorAll('.font-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.font === (currentSettings.fontFallback || currentSettings.fontFamily));
            });
            
            karaokeModeInput.checked = currentSettings.karaokeMode || false;
        }
        
        function rgbToHex(rgb) {
            const match = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (match) {
                return '#' + [match[1], match[2], match[3]].map(c => 
                    parseInt(c).toString(16).padStart(2, '0')
                ).join('');
            }
            return rgb;
        }
        
        function getContrastColor(color) {
            if (!color || typeof color !== 'string') return '#ffffff';
            const match = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (match) {
                const r = parseInt(match[1]), g = parseInt(match[2]), b = parseInt(match[3]);
                const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                return brightness > 128 ? '#000000' : '#ffffff';
            }
            return '#ffffff';
        }
        
        textColorPicker.addEventListener('input', (e) => {
            currentSettings.textColor = e.target.value;
            updateUI();
        });

        highlightStrokeColorPicker.addEventListener('input', (e) => {
            currentSettings.highlightStrokeColor = e.target.value;
            updateUI();
        });

        restColorPicker.addEventListener('input', (e) => {
            currentSettings.restColor = e.target.value;
            updateUI();
        });

        restStrokeColorPicker.addEventListener('input', (e) => {
            currentSettings.restStrokeColor = e.target.value;
            updateUI();
        });
        
        fontSizeInput.addEventListener('input', (e) => {
            currentSettings.fontSize = parseInt(e.target.value) || 28;
            updateUI();
        });
        
        fontFamilyOptions.addEventListener('click', (e) => {
            const option = e.target.closest('.font-option');
            if (option) {
                currentSettings.fontFamily = option.dataset.font;
                updateUI();
            }
        });

        fontFallbackOptions.addEventListener('click', (e) => {
            const option = e.target.closest('.font-option');
            if (option) {
                currentSettings.fontFallback = option.dataset.font;
                updateUI();
            }
        });

        fontSearchInput.addEventListener('input', (e) => {
            filterFonts(e.target.value, fontFamilyOptions);
        });

        fontFallbackSearchInput.addEventListener('input', (e) => {
            filterFonts(e.target.value, fontFallbackOptions);
        });
        
        karaokeModeInput.addEventListener('change', (e) => {
            currentSettings.karaokeMode = e.target.checked;
        });
        
        resetBtn.addEventListener('click', () => {
            currentSettings = {
                textColor: '#ffffff',
                highlightStrokeColor: '#000000',
                restColor: '#999999',
                restStrokeColor: '#000000',
                fontSize: 28,
                fontFamily: 'Microsoft YaHei',
                fontFallback: 'Microsoft YaHei',
                karaokeMode: false
            };
            updateUI();
        });
        
        saveBtn.addEventListener('click', async () => {
            if (window.electronAPI) {
                await window.electronAPI.saveLyricSettings(currentSettings);
                window.close();
            }
        });
        
        loadSettings();
    </script>
</body>
</html>
