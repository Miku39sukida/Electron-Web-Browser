<!DOCTYPE html>
<html lang="zh-CN">
<!-- 如需添加常用网站，请到457行添加 -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页浏览器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #f8b500 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 105, 180, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      padding: 40px;
      max-width: 700px;
      width: 100%;
      position: relative;
      z-index: 1;
      border: 2px solid rgba(255, 182, 193, 0.5);
    }

    .container::after {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #ff6b9d, #f8b500, #ff6b9d);
      border-radius: 26px;
      z-index: -1;
      opacity: 0.5;
      animation: rainbow 3s ease infinite;
    }

    @keyframes rainbow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    h1 {
      text-align: center;
      color: #c44569;
      margin-bottom: 30px;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(255, 107, 157, 0.3);
      letter-spacing: 2px;
    }

    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    .search-box input {
      flex: 1;
      padding: 16px 24px;
      border: 2px solid #ffb6c1;
      border-radius: 16px;
      font-size: 16px;
      outline: none;
      transition: all 0.3s;
      background: rgba(255, 240, 245, 0.8);
    }

    .search-box input:focus {
      border-color: #ff6b9d;
      box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.2);
      background: white;
    }

    .search-box input::placeholder {
      color: #ffb6c1;
    }

    .search-box button {
      padding: 16px 32px;
      background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
    }

    .search-box button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 107, 157, 0.5);
    }

    .websites-section {
      margin-top: 20px;
    }

    .websites-section h2 {
      color: #c44569;
      margin-bottom: 20px;
      font-size: 22px;
      padding-left: 15px;
      border-left: 5px solid #ff6b9d;
      font-weight: bold;
    }

    .websites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 18px;
    }

    .website-card {
      background: linear-gradient(145deg, #fff0f5, #ffe4e1);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .website-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff6b9d, #f8b500);
      transform: scaleX(0);
      transition: transform 0.3s;
    }

    .website-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 15px 40px rgba(255, 107, 157, 0.3);
      border-color: #ff6b9d;
    }

    .website-card:hover::before {
      transform: scaleX(1);
    }

    .website-icon {
      font-size: 40px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .website-icon img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 10px;
    }

    .website-name {
      color: #c44569;
      font-size: 15px;
      font-weight: bold;
    }

    .website-url {
      color: #ff91a4;
      font-size: 12px;
      margin-top: 6px;
    }

    .downloads-btn {
      width: 100%;
      margin-top: 30px;
      padding: 16px;
      background: linear-gradient(135deg, #f8b500, #ffd700);
      color: #8b4513;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(248, 181, 0, 0.4);
    }

    .downloads-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(248, 181, 0, 0.5);
    }

    .search-section {
      margin-top: 20px;
    }

    .search-box-wrapper {
      position: relative;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: rgba(255, 240, 245, 0.8);
      border: 2px solid #ffb6c1;
      border-radius: 20px;
      padding: 4px;
      transition: all 0.3s;
    }

    .search-bar:focus-within {
      border-color: #ff6b9d;
      box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.2);
      background: white;
    }

    .engine-selector {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      cursor: pointer;
      border-radius: 16px;
      transition: all 0.2s;
      gap: 6px;
      background: transparent;
    }

    .engine-selector:hover {
      background: rgba(255, 182, 193, 0.3);
    }

    .engine-selector-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: contain;
    }

    .engine-selector-arrow {
      font-size: 12px;
      color: #ff91a4;
      transition: transform 0.2s;
    }

    .search-bar:focus-within .engine-selector-arrow {
      transform: rotate(180deg);
    }

    .search-divider {
      width: 1px;
      height: 28px;
      background: #ffb6c1;
      margin: 0 4px;
    }

    .search-input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-input-wrapper input {
      width: 100%;
      padding: 12px 16px;
      border: none;
      outline: none;
      font-size: 15px;
      background: transparent;
      color: #c44569;
    }

    .search-input-wrapper input::placeholder {
      color: #ffb6c1;
    }

    .search-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #ff6b9d, #c44569);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      margin-right: 4px;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
    }

    .engine-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 8px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      border: 2px solid #ffb6c1;
      padding: 8px;
      display: none;
      z-index: 100;
    }

    .engine-dropdown.active {
      display: block;
      animation: slideDown 0.2s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .engine-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .engine-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      gap: 6px;
    }

    .engine-item:hover {
      background: rgba(255, 182, 193, 0.3);
      transform: translateY(-2px);
    }

    .engine-item.active {
      background: rgba(255, 107, 157, 0.1);
      border: 2px solid #ff6b9d;
    }

    .engine-item-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
    }

    .engine-item-name {
      font-size: 12px;
      color: #c44569;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌸 网页浏览器 🌸</h1>
    
    <div class="search-box">
      <input type="text" id="urlInput" placeholder="输入网址，如：www.bilibili.com" />
      <button onclick="openUrl()">访问</button>
    </div>

    <div class="search-section">
      <div class="search-box-wrapper">
        <div class="search-bar">
          <div class="engine-selector" onclick="toggleEngineDropdown()">
            <img id="currentEngineIcon" src="icon/Google.ico" alt="Google" class="engine-selector-icon" />
            <span class="engine-selector-arrow">▼</span>
          </div>
          <div class="search-divider"></div>
          <div class="search-input-wrapper">
            <input type="text" id="searchInput" placeholder="输入并搜索..." />
          </div>
          <button class="search-btn" onclick="doSearch()">搜索</button>
        </div>
        <div class="engine-dropdown" id="engineDropdown">
          <div class="engine-grid">
            <div class="engine-item active" id="engineGoogle" onclick="selectEngine('google')">
              <img src="icon/Google.ico" alt="Google" class="engine-item-icon" />
              <span class="engine-item-name">Google</span>
            </div>
            <div class="engine-item" id="engineBaidu" onclick="selectEngine('baidu')">
              <img src="https://www.baidu.com/favicon.ico" alt="百度" class="engine-item-icon" />
              <span class="engine-item-name">百度</span>
            </div>
            <div class="engine-item" id="engineBing" onclick="selectEngine('bing')">
              <img src="https://www.bing.com/favicon.ico" alt="Bing" class="engine-item-icon" />
              <span class="engine-item-name">Bing</span>
            </div>
            <div class="engine-item" id="engineBilibili" onclick="selectEngine('bilibili')">
              <img src="https://www.bilibili.com/favicon.ico" alt="哔哩哔哩" class="engine-item-icon" />
              <span class="engine-item-name">哔哩哔哩</span>
            </div>
            <div class="engine-item" id="engineMoegirl" onclick="selectEngine('moegirl')">
              <img src="https://zh.moegirl.org.cn/favicon.ico" alt="萌娘百科" class="engine-item-icon" />
              <span class="engine-item-name">萌娘百科</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="websites-section">
      <h2>💕 常用网站 💕</h2>
      <div class="websites-grid">
        <!-- 在此添加常用网站 -->
        <div class="website-card" onclick="openSite('https://space.bilibili.com/592777997')">
          <div class="website-icon"><img src="https://www.bilibili.com/favicon.ico" alt="B站个人空间" /></div>
          <div class="website-name">B站个人空间</div>
          <div class="website-url">bilibili.com</div>
        </div>
        <div class="website-card" onclick="openSite('https://www.bilibili.com')">
          <div class="website-icon"><img src="https://www.bilibili.com/favicon.ico" alt="哔哩哔哩" /></div>
          <div class="website-name">哔哩哔哩</div>
          <div class="website-url">bilibili.com</div>
        </div>
        <div class="website-card" onclick="openSite('https://zh.moegirl.org.cn')">
          <div class="website-icon"><img src="https://zh.moegirl.org.cn/favicon.ico" alt="萌娘百科" /></div>
          <div class="website-name">萌娘百科</div>
          <div class="website-url">moegirl.org.cn</div>
        </div>
        <div class="website-card" onclick="openSite('https://www.vsqx.top')">
          <div class="website-icon"><img src="https://www.vsqx.top/favicon.ico" alt="VSQX分享" /></div>
          <div class="website-name">VSQX分享</div>
          <div class="website-url">vsqx.top</div>
        </div>
        <div class="website-card" onclick="openSite('http://110.42.61.227:3901/TeyvatFont')">
          <div class="website-icon"><img src="icon/TeyvatFontGenerator.png" alt="提瓦特通用文" /></div>
          <div class="website-name">提瓦特通用文</div>
          <div class="website-url">TeyvatFont</div>
        </div>
        <div class="website-card" onclick="openSite('https://inftab.com')">
          <div class="website-icon"><img src="icon/inftab.ico" alt="Inftab" /></div>
          <div class="website-name">Infinity 主页</div>
          <div class="website-url">inftab.com</div>
        </div>
        <div class="website-card" onclick="openSite('https://miku39sukida.github.io/bpmtest/bpmtest.html')">
          <div class="website-icon"><img src="icon/bpmtest.png" alt="BPM测试" /></div>
          <div class="website-name">BPM测试</div>
          <div class="website-url">bpmtest</div>
        </div>
          <div class="website-card" onclick="openSite('https://github.com')">
          <div class="website-icon"><img src="icon/github.ico" alt="GitHub" /></div>
          <div class="website-name">GitHub</div>
          <div class="website-url">github.com</div>
        </div>
      </div>
    </div>

    <button class="downloads-btn" onclick="openDownloads()">📥 打开下载管理</button>

    </div>

  <script>
    async function openSite(url) {
      await window.electronAPI.openUrl(url)
    }

    async function openUrl() {
      const input = document.getElementById('urlInput')
      let url = input.value.trim()
      
      if (!url) return

      url = url.replace(/^["']|["']$/g, '')

      if (!url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('file://')) {
        if (/^(\d{1,3}\.){3}\d{1,3}(:\d+)?/.test(url) || /:\d+/.test(url)) {
          url = 'http://' + url
        } else if (/^[a-zA-Z]:[\\/]/.test(url) || url.startsWith('\\') || url.startsWith('/') || url.includes('.html') || url.includes('.htm') || url.includes('.md')) {
          url = 'file:///' + url.replace(/\\/g, '/')
        } else {
          url = 'https://' + url
        }
      }

      await window.electronAPI.openUrl(url)
      input.value = ''
    }

    async function openDownloads() {
      await window.electronAPI.openDownloads()
    }

    document.getElementById('urlInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        openUrl()
      }
    })

    let currentEngine = 'google'

    async function initSearchEngine() {
      try {
        const savedEngine = await window.electronAPI.getSearchEngine()
        if (savedEngine) {
          currentEngine = savedEngine
          selectEngine(savedEngine)
        }
      } catch (err) {
        console.error('Failed to load search engine:', err)
      }
    }

    function toggleEngineDropdown() {
      const dropdown = document.getElementById('engineDropdown')
      dropdown.classList.toggle('active')
    }

    async function selectEngine(engine) {
      currentEngine = engine
      document.querySelectorAll('.engine-item').forEach(item => {
        item.classList.remove('active')
      })
      document.getElementById('engine' + engine.charAt(0).toUpperCase() + engine.slice(1)).classList.add('active')
      
      const iconMap = {
        google: 'icon/Google.ico',
        baidu: 'https://www.baidu.com/favicon.ico',
        bing: 'https://www.bing.com/favicon.ico',
        bilibili: 'https://www.bilibili.com/favicon.ico',
        moegirl: 'https://zh.moegirl.org.cn/favicon.ico'
      }
      document.getElementById('currentEngineIcon').src = iconMap[engine]
      
      document.getElementById('engineDropdown').classList.remove('active')
      
      try {
        await window.electronAPI.setSearchEngine(engine)
      } catch (err) {
        console.error('Failed to save search engine:', err)
      }
    }

    async function doSearch() {
      const input = document.getElementById('searchInput')
      const query = input.value.trim()
      
      if (!query) return

      let searchUrl = ''
      switch (currentEngine) {
        case 'google':
          searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query)
          break
        case 'bing':
          searchUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(query)
          break
        case 'baidu':
          searchUrl = 'https://www.baidu.com/s?wd=' + encodeURIComponent(query)
          break
        case 'bilibili':
          searchUrl = 'https://search.bilibili.com/all?keyword=' + encodeURIComponent(query)
          break
        case 'moegirl':
          searchUrl = 'https://zh.moegirl.org.cn/' + encodeURIComponent(query)
          break
      }

      await window.electronAPI.openUrl(searchUrl)
      input.value = ''
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        doSearch()
      }
    })

    document.addEventListener('click', function(e) {
      const dropdown = document.getElementById('engineDropdown')
      const selector = document.querySelector('.engine-selector')
      if (!dropdown.contains(e.target) && !selector.contains(e.target)) {
        dropdown.classList.remove('active')
      }
    })

    document.addEventListener('DOMContentLoaded', function() {
      initSearchEngine()
    })
  </script>
</body>
</html>
